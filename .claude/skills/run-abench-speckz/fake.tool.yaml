name: fake-bench
command: "python tests/fixtures/fake_tool.py"
version_command: "python tests/fixtures/fake_tool.py --version"
timeout_seconds: 10

capture:
  rps:    "$.summary.requestsPerSec"
  p50_ms: "$.summary.latencies.p50"
  p95_ms: "$.summary.latencies.p95"

pretty_names:
  rps:    "Requests/s"
  p50_ms: "P50 latency"
  p95_ms: "P95 latency"

units:
  p50_ms: ms
  p95_ms: ms

higher_is_better:
  rps:    true
  p50_ms: false
  p95_ms: false
