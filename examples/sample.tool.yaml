name: sample-bench
command: "python examples/sample_bench.py"
version_command: "python examples/sample_bench.py --version"
timeout_seconds: 60

capture:
  rps:     "$.summary.requestsPerSec"
  mean_ms: "$.summary.latencies.mean"
  p50_ms:  "$.summary.latencies.p50"
  p95_ms:  "$.summary.latencies.p95"
  p99_ms:  "$.summary.latencies.p99"

pretty_names:
  rps:     "Requests/s"
  mean_ms: "Mean latency"
  p50_ms:  "P50 latency"
  p95_ms:  "P95 latency"
  p99_ms:  "P99 latency"

units:
  mean_ms: ms
  p50_ms:  ms
  p95_ms:  ms
  p99_ms:  ms

higher_is_better:
  rps:     true
  mean_ms: false
  p50_ms:  false
  p95_ms:  false
  p99_ms:  false

# Declarative plot definitions used by `benchspec stats --report`.
# When any plots are defined, they replace the default per-metric charts.
plots:
  - id: rps_by_workload
    type: bar
    title: "Throughput by workload"
    x: workload
    y: rps

  - id: latency_breakdown
    type: stacked-bar
    title: "Latency percentile breakdown"
    x: workload
    y: [p50_ms, p95_ms, p99_ms]

  - id: rps_vs_concurrency
    type: line
    title: "Throughput scaling"
    x: concurrency
    y: rps
    group_by: workload

  - id: throughput_vs_latency
    type: scatter
    title: "Throughput / latency tradeoff"
    x: rps
    y: p95_ms
    group_by: workload
