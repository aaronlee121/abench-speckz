[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "abench-speckz"
version = "0.4.5"
description = "YAML-driven benchmark sweeps: generate env-file combinations, execute a tool across each, and query DuckDB-backed aggregate stats."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "Benixon Arul Dhas", email = "its.me@benixon.dev"},
]
keywords = ["benchmark", "sweep", "yaml", "performance", "stats"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Benchmark",
]
dependencies = [
    "PyYAML>=6.0",
    "jsonpath-ng>=1.6",
    "duckdb>=0.10",
    "markdown>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-timeout>=2",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.urls]
Homepage = "https://github.com/benixon/abench-speckz"
Issues = "https://github.com/benixon/abench-speckz/issues"
Changelog = "https://github.com/benixon/abench-speckz/blob/main/CHANGELOG.md"

[project.scripts]
abench-speckz = "abench_speckz.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "W",   # pycodestyle warnings
]
ignore = [
    "E501",  # line length (handled by formatter; long lines in tests are fine)
    "B008",  # function-call-in-default-argument (Path() defaults are clear)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]   # tests use looser conventions

[tool.mypy]
python_version = "3.10"
files = ["src/abench_speckz"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
